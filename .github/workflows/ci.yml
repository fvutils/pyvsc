name: CI
on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  # ---------------------------------------------------------------------- #
  # The release-authority master switch. Resolved in its OWN job because an
  # `if:` on a job cannot reference a step in that same job, so the value has
  # to arrive through `needs.<job>.outputs`.
  #
  # A consumer that reads needs.gate.outputs WITHOUT declaring `needs: gate`
  # gets an EMPTY STRING rather than an error -- the publish condition is then
  # false forever, nothing publishes, and nothing goes red. That is the
  # quietest failure available here, so the shadow check in
  # .forgejo/workflows/ci.yml asserts the wiring explicitly.
  # ---------------------------------------------------------------------- #
  gate:
    name: Release authority
    runs-on: ubuntu-latest
    outputs:
      authority: ${{ steps.resolve.outputs.authority }}
    steps:
      - id: resolve
        # The python is ONE LINE on purpose: a multi-line `python3 -c` body has
        # to start at column 0, which terminates the YAML block scalar above it
        # and silently corrupts the workflow rather than failing to parse.
        run: |
          url=https://dvkit.org/.well-known/release-authority.json
          if ! body=$(curl -fsS --max-time 10 "$url"); then
            # FAIL CLOSED WHEN A RELEASE COULD ACTUALLY HAPPEN, and quietly
            # otherwise. In this org a release is a `v*` TAG, so that -- not
            # the event name -- is the test. Keying on the event name would be
            # wrong here in both directions: a tag push IS a push, so it would
            # let a release through unresolved, and every ordinary push would
            # then also be treated as release-critical and fail the build.
            #
            # A release blocked by a dvkit.org outage is recoverable in ten
            # minutes. A version published twice from two forges is not: PyPI
            # lets a version be yanked, never reused.
            case "$GITHUB_REF" in
              refs/tags/v*)
                echo "::error::release-authority switch unreachable; refusing to publish"
                exit 1 ;;
              *)
                echo "authority=none" >> "$GITHUB_OUTPUT"
                echo "switch unreachable, and this ref cannot release; continuing"
                exit 0 ;;
            esac
          fi
          auth=$(printf '%s' "$body" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=os.environ["GITHUB_REPOSITORY"]; print(d["repos"].get(r) or d["orgs"].get(r.split("/")[0]) or d["default"])')
          echo "release authority for $GITHUB_REPOSITORY: $auth"
          echo "authority=$auth" >> "$GITHUB_OUTPUT"

  ci-linux:
    runs-on: ubuntu-latest
    # Run the full ve/unit and ve/unit_dc suites once per solver back-end.
    # VSC_SOLVER is read at import time, so each back-end needs its own
    # process/job. The boolector leg is the canonical one that also builds docs
    # and hands its distributions to publish-pypi (see the guards below); the
    # dv-solve leg exercises the suites under the native back-end.
    strategy:
      fail-fast: false
      matrix:
        solver: [boolector, dv-solve]
    steps:
    - uses: actions/checkout@v1
    - uses: actions/setup-python@v2
      with:
        python-version: '3.10'
    - name: Configure Python
      run: |
        python3 -m venv python
        ./python/bin/python3 -m pip install build twine
        ./python/bin/python3 -m pip install pip setuptools --upgrade
        ./python/bin/python3 -m pip install -r requirements_dev.txt
    - name: Build Package
      run: |
        # THE TAG IS THE VERSION. pyproject.toml takes the version from
        # src/vsc/__version__.py (BASE + SUFFIX). A tag build leaves SUFFIX
        # empty, so a release carries exactly BASE (checked against the tag in
        # publish-pypi). Every other build stamps SUFFIX with a PEP 440 dev +
        # local segment:
        #
        #   0.9.6.dev37412289187+gh.g7775f37
        #
        # .dev sorts BEFORE the release (a bare .<run-id> sorts after it, so a CI
        # build would outrank the release it came from); +gh. says which forge
        # built it (run ids collide across forges); and PyPI rejects any local
        # segment, so a branch build can never be published.
        case "$GITHUB_REF" in
          refs/tags/v*) echo "tag build -- leaving version clean" ;;
          *) sed -i 's/^SUFFIX = ""$/SUFFIX = ".dev'"${GITHUB_RUN_ID}"'+gh.g'"$(git rev-parse --short=7 HEAD)"'"/' src/vsc/__version__.py ;;
        esac
        grep "^SUFFIX = " src/vsc/__version__.py
        rm -rf dist/
        ./python/bin/python3 -m build .
        ./python/bin/python3 -m twine check dist/*
        ls dist/
    - name: Install dv-solve
      if: matrix.solver == 'dv-solve'
      # The native back-end under test; builds its lib via CMake (provided by the
      # ubuntu-latest image). Only needed on the dv-solve leg.
      run: |
        # dv-solve builds CaDiCaL from source, found as a SIBLING checkout
        # (<packages>/cadical, normally fetched by ivpm), so a bare
        # `pip install git+...dv-solve.git` fails at CMake configure. Clone
        # both side by side, CaDiCaL at the tag dv-solve's own ivpm.yaml pins.
        git clone -q --depth 1 https://github.com/fvutils/dv-solve.git packages/dv-solve
        cadical_tag=$(sed -n '/name: cadical/,/tag:/s/.*tag: *//p' packages/dv-solve/ivpm.yaml)
        git -c advice.detachedHead=false clone -q --depth 1 -b "$cadical_tag" https://github.com/arminbiere/cadical.git packages/cadical
        ./python/bin/python3 -m pip install ./packages/dv-solve
    - name: Run Tests
      env:
        VSC_SOLVER: ${{ matrix.solver }}
        # Post-solve model validation (KF-1b). Re-evaluates every constraint
        # against the model dv-solve returned and fails on a violation, so a
        # mis-compiled constraint is loud here rather than silently producing
        # illegal stimulus. Ignored by the boolector leg. Costs a constraint-tree
        # walk per solve, which is why it is not the runtime default.
        VSC_DVSOLVE_VALIDATE: '1'
      run: |
        export PYTHONPATH=`pwd`/src
        tests=`ls ve/unit/*.py | grep -v test_random_dist | grep -v vsc_test_case | grep -v test_covergroup_programmatic | grep -v test_rand_mode`
        ./python/bin/python3 -m pytest --no-cov -v $tests
        # The dataclass front-end's suite. Its own directory: ve/unit_dc has a
        # conftest.py and its own base class, and shares test module names
        # with ve/unit.
        (cd ve/unit_dc && ../../python/bin/python3 -m pytest --no-cov -q .)
        # Again on the legacy randomize_with path (operator overloading), which
        # still serves a body whose source cannot be read. The default parses
        # the body (doc/notes/vdc_constraint_grammar_completion_plan.md 3.7).
        (cd ve/unit_dc && VSC_DC_INLINE_PARSE=0 ../../python/bin/python3 -m pytest --no-cov -q .)
    - name: Build Docs
      # Built once, from the canonical boolector leg only, as a CI check.
      if: matrix.solver == 'boolector'
      run: |
        # The results pages come from the committed history, as on Forgejo.
        PYTHONPATH=benchmarks ./python/bin/python3 -m perf.render --out doc/source/results --require-run
        cd doc
        set -o pipefail
        make html 2>&1 | tee build-html.log
        # The dataclass pages build without warnings (the classic pages still
        # have unresolved cross-references). Keep it that way.
        if grep "source/dataclass/" build-html.log; then
          echo "::error::Sphinx warnings in doc/source/dataclass (above)"
          exit 1
        fi
        touch build/html/.nojekyll
        cp -r build/html ../
    # The GitHub Pages deploy step WAS HERE and is deliberately gone (2026-08-31).
    #
    # It had no condition beyond the default branch, and since fvutils joined the
    # Forgejo <-> GitHub mirror that branch is moved by a five-minute cron. A mirror
    # operation must never be a publishing operation.
    #
    # DELETED rather than gated because dvkit.org owns all documentation: these docs
    # publish to dvkit.org/fvutils/<repo>/ from .forgejo/workflows/, which uploads
    # them as an artifact for the host-side poller. A tag-gated Pages deploy would
    # still be a second publisher of the same content on a different schedule, and
    # two publishers that agree today diverge the first time one fails quietly.
    #
    # THE DOCS BUILD ABOVE STAYS, as a CI check. A broken cross-reference should fail
    # here, not render as a dead link on dvkit.org.

    - name: Upload distributions
      # Handed to publish-pypi, from the canonical leg only. Uploaded on every
      # build so a branch's wheel is reviewable; only a tag publishes it.
      if: matrix.solver == 'boolector'
      uses: actions/upload-artifact@v4
      with:
        name: dist-pyvsc
        path: dist/*
        if-no-files-found: error

  # ---------------------------------------------------------------------- #
  # NO-BOOLECTOR. The configuration a Windows user gets: pyboolector has no
  # Windows wheel, so pyproject.toml installs dv-solve alone there, and the
  # default back-end resolves to dv-solve (src/vsc/impl/ctor.py). Run on Linux
  # because it is the same code path and Linux CI is the one this repo trusts;
  # ci-windows below adds the platform itself.
  #
  # What it guards: nothing imports pyboolector at module scope; the default
  # back-end resolves without VSC_SOLVER (deliberately UNSET here); dv-solve
  # serves alone what `auto` would otherwise hand to Boolector (the self-served
  # path that hid the c32 == a16 + b16 carry bug); solve-failure diagnostics
  # work without Boolector. Tests that need Boolector itself are marked
  # requires_boolector / known_gap_without_boolector and skip or xfail here.
  # ---------------------------------------------------------------------- #
  ci-no-boolector:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Configure Python
      run: |
        python3 -m venv python
        ./python/bin/python3 -m pip install pip setuptools wheel --upgrade
        # requirements_dev.txt minus pyboolector: install pyvsc's other runtime
        # deps by hand, and pyvsc itself --no-deps (its markers would pull
        # pyboolector in on Linux).
        ./python/bin/python3 -m pip install pytest toposort 'git+https://github.com/fvutils/pyucis.git#egg=pyucis'
        git clone -q --depth 1 https://github.com/fvutils/dv-solve.git packages/dv-solve
        cadical_tag=$(sed -n '/name: cadical/,/tag:/s/.*tag: *//p' packages/dv-solve/ivpm.yaml)
        git -c advice.detachedHead=false clone -q --depth 1 -b "$cadical_tag" https://github.com/arminbiere/cadical.git packages/cadical
        ./python/bin/python3 -m pip install ./packages/dv-solve
        ./python/bin/python3 -m pip install --no-deps -e .
        if ./python/bin/python3 -c 'import pyboolector' 2>/dev/null; then
          echo "::error::pyboolector is installed; this job must run without it"
          exit 1
        fi
    - name: Run Tests
      env:
        VSC_DVSOLVE_VALIDATE: '1'
      run: |
        test "$(./python/bin/python3 -c 'import vsc; print(vsc.get_solver_backend())')" = dv-solve
        tests=`ls ve/unit/*.py | grep -v test_random_dist | grep -v vsc_test_case | grep -v test_covergroup_programmatic | grep -v test_rand_mode`
        ./python/bin/python3 -m pytest -v $tests
        (cd ve/unit_dc && ../../python/bin/python3 -m pytest -q .)

  # ---------------------------------------------------------------------- #
  # PYTHON 3.12. The other legs run 3.10, where a parsed randomize_with body
  # is skipped with a settrace hook; 3.12+ uses sys.monitoring instead
  # (src/vsc/dc/inline_parse.py skip_body). This leg runs the dataclass suite
  # on 3.12 with dv-solve, and the skip tests once under coverage, which
  # traces lines itself: the body must still be skipped, and coverage must
  # still see the lines after the block.
  # ---------------------------------------------------------------------- #
  ci-py312:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Configure Python
      run: |
        python3 -m venv python
        ./python/bin/python3 -m pip install pip setuptools wheel --upgrade
        ./python/bin/python3 -m pip install pytest coverage toposort 'git+https://github.com/fvutils/pyucis.git#egg=pyucis'
        git clone -q --depth 1 https://github.com/fvutils/dv-solve.git packages/dv-solve
        cadical_tag=$(sed -n '/name: cadical/,/tag:/s/.*tag: *//p' packages/dv-solve/ivpm.yaml)
        git -c advice.detachedHead=false clone -q --depth 1 -b "$cadical_tag" https://github.com/arminbiere/cadical.git packages/cadical
        ./python/bin/python3 -m pip install ./packages/dv-solve
        ./python/bin/python3 -m pip install --no-deps -e .
    - name: Run Tests
      env:
        VSC_SOLVER: dv-solve
        VSC_DVSOLVE_VALIDATE: '1'
      run: |
        (cd ve/unit_dc && ../../python/bin/python3 -m pytest -q .)
        (cd ve/unit_dc && ../../python/bin/python3 -m coverage run -m pytest -q test_inline_skip.py test_inline_parse_switch.py)

  # ---------------------------------------------------------------------- #
  # WINDOWS. The platform itself, dv-solve only. dv-solve is built from source
  # here because PyPI has no Windows dv-solve wheel yet (its wheels.yml builds
  # one but publishes linux-x86_64 only) -- so this proves pyvsc runs on
  # Windows, not that `pip install pyvsc` does. The build setup mirrors
  # dv-solve's own Windows job: Ninja + MSVC, with CaDiCaL fetched beside it
  # exactly as on Linux (MSVC builds CaDiCaL too; cmake/cadical.cmake stops if
  # the sources are missing).
  #
  # NOT YET A RELEASE GATE: publish-pypi does not need this job. Add it to
  # publish-pypi's `needs` once it has run green.
  # ---------------------------------------------------------------------- #
  ci-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install ninja
      run: choco install ninja --no-progress
    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Configure Python
      run: |
        python -m pip install pip setuptools wheel --upgrade
        python -m pip install pytest toposort 'git+https://github.com/fvutils/pyucis.git#egg=pyucis'
        git clone -q --depth 1 https://github.com/fvutils/dv-solve.git packages/dv-solve
        cadical_tag=$(sed -n '/name: cadical/,/tag:/s/.*tag: *//p' packages/dv-solve/ivpm.yaml)
        git -c advice.detachedHead=false clone -q --depth 1 -b "$cadical_tag" https://github.com/arminbiere/cadical.git packages/cadical
        python -m pip install ./packages/dv-solve
        python -m pip install --no-deps -e .
    - name: Run Tests
      env:
        VSC_DVSOLVE_VALIDATE: '1'
      run: |
        test "$(python -c 'import vsc; print(vsc.get_solver_backend())')" = dv-solve
        tests=`ls ve/unit/*.py | grep -v test_random_dist | grep -v vsc_test_case | grep -v test_covergroup_programmatic | grep -v test_rand_mode`
        python -m pytest -v $tests
        (cd ve/unit_dc && python -m pytest -q .)

  # ---------------------------------------------------------------------- #
  # PUBLISHING. Its own job because `needs` is the only thing in Actions that
  # can make a release WAIT for other jobs. When publishing was a step in the
  # boolector leg of ci-linux, a red dv-solve leg (fail-fast: false) did not
  # stop the release.
  #
  # needs: a red -- or skipped -- gating job blocks the upload. Failing closed
  # on a release is this repo's standing preference; see the gate job.
  # ---------------------------------------------------------------------- #
  publish-pypi:
    needs: [gate, ci-linux, ci-no-boolector]
    runs-on: ubuntu-latest
    # GATED 2026-08-31 (wave 3b). Two clauses, and both are load-bearing:
    #
    #   refs/tags/v*   this repo is mirrored to Forgejo and back on a five-minute
    #                  cron, and git-sync moves the DEFAULT BRANCH. The condition
    #                  replaced here was `refs/heads/master` (or main), which a sync
    #                  cycle satisfies by construction -- so mirroring was a release
    #                  trigger. A tag is a deliberate act; a cycle never creates one.
    #
    #   authority      the release-authority master switch at
    #                  dvkit.org/.well-known/release-authority.json, so that which
    #                  forge may publish is one decision in one place rather than
    #                  fourteen workflow files.
    #
    # WHAT THIS COSTS. The per-push `.<run-id>` dev wheel is gone: a push to the
    # default branch no longer publishes anything to PyPI. That is the same trade
    # already made for the eight mballance-utils repos, and it is the one
    # sync-policy.toml describes as outstanding for exactly this shape.
    if: >-
      needs.gate.outputs.authority == 'github' &&
      startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v4
    - name: Download distributions
      uses: actions/download-artifact@v4
      with:
        name: dist-pyvsc
        path: dist
    - name: Check the tag IS the version
      # REQUIRED before publishing: the tag alone decides the published version.
      # Asserts the source (src/vsc/__version__.py) agrees with the tag AND that
      # every built artifact agrees with the source -- a build that read a stale
      # version, or picked up a SUFFIX stamp, passes the first and fails the
      # second. v0.9.6 shipped as 0.9.6.37412289187 for want of this check.
      run: |
        tag="${GITHUB_REF#refs/tags/v}"
        base=$(python3 -c 'import re; print(re.search(r"^BASE\s*=\s*\"([^\"]+)\"", open("src/vsc/__version__.py").read(), re.M).group(1))')
        echo "tag=$tag  source=$base"
        if [ "$tag" != "$base" ]; then
          echo "::error::tag v$tag does not match BASE=$base in src/vsc/__version__.py"
          exit 1
        fi
        for f in dist/*; do
          case "$(basename "$f")" in
            pyvsc-${base}-*.whl|pyvsc-${base}.tar.gz) ;;
            *) echo "::error::artifact $(basename "$f") is not version ${base}"; exit 1 ;;
          esac
        done
        echo "OK: tag, source version and every artifact agree on ${base}"
    - name: Publish to PyPi
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}

  # F-0b — the dv-solve XCHECK soak gate (Phase F). Runs the real-workload
  # corpus (ve/xcheck_corpus.txt) under VSC_SOLVER=dv-solve VSC_DVSOLVE_XCHECK=1,
  # so every RandSet dv-solve solves is cross-checked against a Boolector-built
  # formula (verdict + membership). A mismatch fails the job. F-4 (flip the
  # global default to dv-solve) is gated on this staying green for the soak
  # period. Separate from ci-linux so the differential gate is independently
  # visible and does not block the build/publish path during bring-up.
  xcheck-soak:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - uses: actions/setup-python@v2
      with:
        python-version: '3.10'
    - name: Configure Python
      run: |
        python3 -m venv python
        ./python/bin/python3 -m pip install pip setuptools wheel --upgrade
        ./python/bin/python3 -m pip install -r requirements_dev.txt
        # dv-solve is the native back-end under test (mirrors the ivpm
        # default-dev dep-set); pyboolector — the XCHECK oracle — comes from
        # requirements_dev.txt. dv-solve builds its native lib via CMake, which
        # the ubuntu-latest image already provides.
        # dv-solve builds CaDiCaL from source, found as a SIBLING checkout
        # (<packages>/cadical, normally fetched by ivpm), so a bare
        # `pip install git+...dv-solve.git` fails at CMake configure. Clone
        # both side by side, CaDiCaL at the tag dv-solve's own ivpm.yaml pins.
        git clone -q --depth 1 https://github.com/fvutils/dv-solve.git packages/dv-solve
        cadical_tag=$(sed -n '/name: cadical/,/tag:/s/.*tag: *//p' packages/dv-solve/ivpm.yaml)
        git -c advice.detachedHead=false clone -q --depth 1 -b "$cadical_tag" https://github.com/arminbiere/cadical.git packages/cadical
        ./python/bin/python3 -m pip install ./packages/dv-solve
    - name: XCHECK soak corpus
      env:
        # Belt and braces: XCHECK needs Boolector to agree, validate_model needs
        # no oracle at all. KF-1 showed the two catch the same class, so run both
        # here -- if the oracle is ever unavailable, the net still holds.
        VSC_DVSOLVE_VALIDATE: '1'
      run: |
        PYTHON=./python/bin/python3 ./ve/run_xcheck_soak.sh

  # ASAN gate — run the suite against an AddressSanitizer-instrumented dv-solve
  # so native memory bugs (out-of-bounds, use-after-free, wild pointers) fail CI
  # instead of staying latent in a normal build and only crashing under a
  # different heap layout. This is what would have caught the unwired-ctypes
  # pointer-truncation crash (builder_expr_concat) that a normal build hid. The
  # instrumented lib is built from dv-solve source (not the pip wheel), so this
  # job clones dv-solve and drives ve/run_asan.sh, which handles the ASan build +
  # LD_PRELOAD wiring. Separate from ci-linux so it does not block build/publish.
  asan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - uses: actions/setup-python@v2
      with:
        python-version: '3.10'
    - name: Configure Python
      run: |
        python3 -m venv python
        ./python/bin/python3 -m pip install pip setuptools wheel --upgrade
        ./python/bin/python3 -m pip install -r requirements_dev.txt
    - name: Build ASan dv-solve + run the suite under it
      run: |
        # ve/run_asan.sh builds the instrumented lib from packages/dv-solve via
        # CMake (Debug -> -fsanitize=address) and loads it via ZSP_SOLVER_PATH.
        # The dv_solve *Python* package must be importable too — add its source
        # tree to PYTHONPATH (the .so itself comes from the ASan build, not pip).
        # dv-solve builds CaDiCaL from source, found as a SIBLING checkout
        # (<packages>/cadical, normally fetched by ivpm), so a bare
        # `pip install git+...dv-solve.git` fails at CMake configure. Clone
        # both side by side, CaDiCaL at the tag dv-solve's own ivpm.yaml pins.
        git clone -q --depth 1 https://github.com/fvutils/dv-solve.git packages/dv-solve
        cadical_tag=$(sed -n '/name: cadical/,/tag:/s/.*tag: *//p' packages/dv-solve/ivpm.yaml)
        git -c advice.detachedHead=false clone -q --depth 1 -b "$cadical_tag" https://github.com/arminbiere/cadical.git packages/cadical
        export PYTHONPATH="$PWD/packages/dv-solve/src"
        PYTHON=./python/bin/python3 ./ve/run_asan.sh

