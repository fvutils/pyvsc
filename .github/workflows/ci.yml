name: CI
on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  # ---------------------------------------------------------------------- #
  # The release-authority master switch. Resolved in its OWN job because an
  # `if:` on a job cannot reference a step in that same job, so the value has
  # to arrive through `needs.<job>.outputs`.
  #
  # A consumer that reads needs.gate.outputs WITHOUT declaring `needs: gate`
  # gets an EMPTY STRING rather than an error -- the publish condition is then
  # false forever, nothing publishes, and nothing goes red. That is the
  # quietest failure available here, so the shadow check in
  # .forgejo/workflows/ci.yml asserts the wiring explicitly.
  # ---------------------------------------------------------------------- #
  gate:
    name: Release authority
    runs-on: ubuntu-latest
    outputs:
      authority: ${{ steps.resolve.outputs.authority }}
    steps:
      - id: resolve
        # The python is ONE LINE on purpose: a multi-line `python3 -c` body has
        # to start at column 0, which terminates the YAML block scalar above it
        # and silently corrupts the workflow rather than failing to parse.
        run: |
          url=https://dvkit.org/.well-known/release-authority.json
          if ! body=$(curl -fsS --max-time 10 "$url"); then
            # FAIL CLOSED WHEN A RELEASE COULD ACTUALLY HAPPEN, and quietly
            # otherwise. In this org a release is a `v*` TAG, so that -- not
            # the event name -- is the test. Keying on the event name would be
            # wrong here in both directions: a tag push IS a push, so it would
            # let a release through unresolved, and every ordinary push would
            # then also be treated as release-critical and fail the build.
            #
            # A release blocked by a dvkit.org outage is recoverable in ten
            # minutes. A version published twice from two forges is not: PyPI
            # lets a version be yanked, never reused.
            case "$GITHUB_REF" in
              refs/tags/v*)
                echo "::error::release-authority switch unreachable; refusing to publish"
                exit 1 ;;
              *)
                echo "authority=none" >> "$GITHUB_OUTPUT"
                echo "switch unreachable, and this ref cannot release; continuing"
                exit 0 ;;
            esac
          fi
          auth=$(printf '%s' "$body" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=os.environ["GITHUB_REPOSITORY"]; print(d["repos"].get(r) or d["orgs"].get(r.split("/")[0]) or d["default"])')
          echo "release authority for $GITHUB_REPOSITORY: $auth"
          echo "authority=$auth" >> "$GITHUB_OUTPUT"

  ci-linux:
    needs: gate
    runs-on: ubuntu-latest
    # Run the full ve/unit suite once per solver back-end. VSC_SOLVER is read at
    # import time, so each back-end needs its own process/job. The boolector leg
    # is the canonical one that also builds docs and publishes on a release tag
    # (see the guards below); the dv-solve leg exercises the suite under the
    # native back-end.
    strategy:
      fail-fast: false
      matrix:
        solver: [boolector, dv-solve]
    steps:
    - uses: actions/checkout@v1
    - uses: actions/setup-python@v2
      with:
        python-version: '3.10'
    - name: Configure Python
      run: |
        python3 -m venv python
        ./python/bin/python3 -m pip install wheel twine
        ./python/bin/python3 -m pip install pip setuptools --upgrade
        ./python/bin/python3 -m pip install -r requirements_dev.txt
        export BUILD_NUM=$GITHUB_RUN_ID
        ./python/bin/python3 setup.py bdist_wheel --universal
    - name: Install dv-solve
      if: matrix.solver == 'dv-solve'
      # The native back-end under test; builds its lib via CMake (provided by the
      # ubuntu-latest image). Only needed on the dv-solve leg.
      run: ./python/bin/python3 -m pip install git+https://github.com/fvutils/dv-solve.git
    - name: Run Tests
      env:
        VSC_SOLVER: ${{ matrix.solver }}
        # Post-solve model validation (KF-1b). Re-evaluates every constraint
        # against the model dv-solve returned and fails on a violation, so a
        # mis-compiled constraint is loud here rather than silently producing
        # illegal stimulus. Ignored by the boolector leg. Costs a constraint-tree
        # walk per solve, which is why it is not the runtime default.
        VSC_DVSOLVE_VALIDATE: '1'
      run: |
        export PYTHONPATH=`pwd`/src
        tests=`ls ve/unit/*.py | grep -v test_random_dist | grep -v vsc_test_case | grep -v test_covergroup_programmatic | grep -v test_rand_mode`
        ./python/bin/python3 -m pytest --no-cov -v $tests
        #        for test in $tests; do 
        #    echo "Test file: $test"
        #    ./python/bin/python3 -m pytest --no-cov -v $test
        #    if test $? -eq 0; then
        #       echo "Status 0"
        #    else
        #       echo "Status non-0"
        #    fi
        #done
        echo "Final status: $?"
    - name: Build Docs
      # Built once, from the canonical boolector leg only, as a CI check.
      if: matrix.solver == 'boolector'
      run: |
        cd doc
        make html
        touch build/html/.nojekyll
        cp -r build/html ../
    # The GitHub Pages deploy step WAS HERE and is deliberately gone (2026-08-31).
    #
    # It had no condition beyond the default branch, and since fvutils joined the
    # Forgejo <-> GitHub mirror that branch is moved by a five-minute cron. A mirror
    # operation must never be a publishing operation.
    #
    # DELETED rather than gated because dvkit.org owns all documentation: these docs
    # publish to dvkit.org/fvutils/<repo>/ from .forgejo/workflows/, which uploads
    # them as an artifact for the host-side poller. A tag-gated Pages deploy would
    # still be a second publisher of the same content on a different schedule, and
    # two publishers that agree today diverge the first time one fails quietly.
    #
    # THE DOCS BUILD ABOVE STAYS, as a CI check. A broken cross-reference should fail
    # here, not render as a dead link on dvkit.org.

    - name: Publish to PyPi
      # GATED 2026-08-31 (wave 3b). Two clauses, and both are load-bearing:
      #
      #   refs/tags/v*   this repo is mirrored to Forgejo and back on a five-minute
      #                  cron, and git-sync moves the DEFAULT BRANCH. The condition
      #                  replaced here was `refs/heads/master` (or main), which a sync
      #                  cycle satisfies by construction -- so mirroring was a release
      #                  trigger. A tag is a deliberate act; a cycle never creates one.
      #
      #   authority      the release-authority master switch at
      #                  dvkit.org/.well-known/release-authority.json, so that which
      #                  forge may publish is one decision in one place rather than
      #                  fourteen workflow files.
      #
      # WHAT THIS COSTS. The per-push `.<run-id>` dev wheel is gone: a push to the
      # default branch no longer publishes anything to PyPI. That is the same trade
      # already made for the eight mballance-utils repos, and it is the one
      # sync-policy.toml describes as outstanding for exactly this shape.
      #
      # matrix.solver: publish once, from the canonical boolector leg only.
      if: >-
        matrix.solver == 'boolector' &&
        needs.gate.outputs.authority == 'github' &&
        startsWith(github.ref, 'refs/tags/v')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}

  # F-0b — the dv-solve XCHECK soak gate (Phase F). Runs the real-workload
  # corpus (ve/xcheck_corpus.txt) under VSC_SOLVER=dv-solve VSC_DVSOLVE_XCHECK=1,
  # so every RandSet dv-solve solves is cross-checked against a Boolector-built
  # formula (verdict + membership). A mismatch fails the job. F-4 (flip the
  # global default to dv-solve) is gated on this staying green for the soak
  # period. Separate from ci-linux so the differential gate is independently
  # visible and does not block the build/publish path during bring-up.
  xcheck-soak:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - uses: actions/setup-python@v2
      with:
        python-version: '3.10'
    - name: Configure Python
      run: |
        python3 -m venv python
        ./python/bin/python3 -m pip install pip setuptools wheel --upgrade
        ./python/bin/python3 -m pip install -r requirements_dev.txt
        # dv-solve is the native back-end under test (mirrors the ivpm
        # default-dev dep-set); pyboolector — the XCHECK oracle — comes from
        # requirements_dev.txt. dv-solve builds its native lib via CMake, which
        # the ubuntu-latest image already provides.
        ./python/bin/python3 -m pip install git+https://github.com/fvutils/dv-solve.git
    - name: XCHECK soak corpus
      env:
        # Belt and braces: XCHECK needs Boolector to agree, validate_model needs
        # no oracle at all. KF-1 showed the two catch the same class, so run both
        # here -- if the oracle is ever unavailable, the net still holds.
        VSC_DVSOLVE_VALIDATE: '1'
      run: |
        PYTHON=./python/bin/python3 ./ve/run_xcheck_soak.sh

  # ASAN gate — run the suite against an AddressSanitizer-instrumented dv-solve
  # so native memory bugs (out-of-bounds, use-after-free, wild pointers) fail CI
  # instead of staying latent in a normal build and only crashing under a
  # different heap layout. This is what would have caught the unwired-ctypes
  # pointer-truncation crash (builder_expr_concat) that a normal build hid. The
  # instrumented lib is built from dv-solve source (not the pip wheel), so this
  # job clones dv-solve and drives ve/run_asan.sh, which handles the ASan build +
  # LD_PRELOAD wiring. Separate from ci-linux so it does not block build/publish.
  asan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - uses: actions/setup-python@v2
      with:
        python-version: '3.10'
    - name: Configure Python
      run: |
        python3 -m venv python
        ./python/bin/python3 -m pip install pip setuptools wheel --upgrade
        ./python/bin/python3 -m pip install -r requirements_dev.txt
    - name: Build ASan dv-solve + run the suite under it
      run: |
        # ve/run_asan.sh builds the instrumented lib from packages/dv-solve via
        # CMake (Debug -> -fsanitize=address) and loads it via ZSP_SOLVER_PATH.
        # The dv_solve *Python* package must be importable too — add its source
        # tree to PYTHONPATH (the .so itself comes from the ASan build, not pip).
        git clone --depth 1 https://github.com/fvutils/dv-solve.git packages/dv-solve
        export PYTHONPATH="$PWD/packages/dv-solve/src"
        PYTHON=./python/bin/python3 ./ve/run_asan.sh

