[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvsc"
dynamic = ["version"]
description = "pyvsc (Verification Stimulus and Coverage) is a Python package for generating randomized stimulus and defining and collecting functional coverage."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Matthew Ballance", email = "matt.ballance@gmail.com"},
]
keywords = ["Python", "Functional Verification", "Constraints", "Coverage"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# THE SOLVER. dv-solve is the one required solver: it publishes a wheel for
# Linux x86_64 and aarch64, macOS x86_64 and arm64, and Windows AMD64 (one
# py3-none wheel per platform, so new Python versions need no new build), and
# PyVSC imports and solves with it alone. pyboolector is OPTIONAL
# (`pip install pyvsc[boolector]`): it has no Windows or Linux aarch64 wheel,
# and falling back to its sdist build is where most install failures came from
# (#141, #170, #171, #184, #187, #254). Install it for the XCHECK cross-check
# oracle, the few shapes dv-solve hands to an external solver, or the old
# default. When it is installed, Boolector is still the default back-end (see
# src/vsc/impl/ctor.py); VSC_SOLVER / vsc.set_solver_backend() choose.
#
# dv-solve has no sdist, so a platform outside its wheel set (e.g. musl Linux)
# fails `pip install pyvsc`; install dv-solve from source there first.
dependencies = [
    "dv-solve>=0.2.4",
    "pyucis>=0.1.4",
    "toposort",
]

[project.optional-dependencies]
boolector = ["pyboolector>=3.2.2"]
# Kept so existing `pyvsc[dv-solve]` install lines keep working.
dv-solve = ["dv-solve>=0.2.4"]

[project.urls]
Homepage = "https://github.com/fvutils/pyvsc"
Documentation = "https://dvkit.org/fvutils/pyvsc/"
Source = "https://github.com/fvutils/pyvsc"

[tool.setuptools.dynamic]
version = {attr = "vsc.__version__._pkg_version"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["vsc*"]
